# fly.toml app configuration file generated for makemyclip-backend

app = "makemyclip-backend"
primary_region = "bos"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2gb" # Recommended for FFmpeg processing
  cpu_kind = "shared"
  cpus = 2
